name: Machine Learning Model training & Dockerize CI Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-dockerize:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Checkout repository code
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    # 2. Setup Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.7'

    # 3. Install required Python packages for running the project
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0 scikit-learn pandas numpy

    # 4. Run MLflow Project to train the model
    - name: Run MLProject
      run: |
        cd MLProject
        mlflow run . --no-conda

    # 5. Commit and push the generated MLruns artifacts to the GitHub Repository
    - name: Commit and Push Model Artifacts
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add MLProject/mlruns/
        git commit -m "Auto-update model artifacts from CI workflow [skip ci]" || echo "No changes to commit"
        git push origin main

    # 6. Build the Docker Image using mlflow models build-docker
    - name: Build Docker Image
      run: |
        # Cari direktori model hasil training terbaru
        MODEL_PATH=$(find MLProject/mlruns -name "model" -type d | head -n 1)
        echo "Menggunakan model di: $MODEL_PATH"
        mlflow models build-docker -m "$MODEL_PATH" -n fsyahputra/titanic-ml-model:latest --env-manager=local

    # 7. Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 8. Push Docker Image to Docker Hub
    - name: Push Docker Image to Docker Hub
      run: |
        docker push fsyahputra/titanic-ml-model:latest
